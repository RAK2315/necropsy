name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Node drives headless Chrome (preinstalled on the runner) for the browser checks,
      # and runs the front-end unit tests.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python -m pip install pytest==9.1.1 hypothesis==6.168.5 fastapi==0.136.3 httpx==0.28.1 uvicorn==0.49.0

      - name: Python suite
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Front-end unit tests
        run: node --test tests/ui/js/logic.test.mjs tests/ui/js/screens.test.mjs
